name: Validate guided commercial product form

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/patch-guided-product-form.py
      - src/components/viso/menu-item-form.tsx
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-generated-form:
    name: Validate generated commercial product form
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply generator in runner only
        run: python scripts/patch-guided-product-form.py

      - name: Verify generated file is already committed
        run: git diff --exit-code -- src/components/viso/menu-item-form.tsx
