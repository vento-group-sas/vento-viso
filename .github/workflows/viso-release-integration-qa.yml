name: VISO Release Integration QA

on:
  push:
    branches:
      - 'integration/**'
  pull_request:
    branches:
      - 'hotfix/**'
      - 'release/**'
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: viso-release-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-validation:
    name: Tests, lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Configure Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run catalog tests, targeted lint, types, build and existing tests
        run: npm test --silent

  dependency-security:
    name: Dependency audit (production and development)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Configure Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Audit complete dependency tree
        run: npm audit --include=dev --audit-level=low
